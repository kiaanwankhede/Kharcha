name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the parser and insights
        run: ./gradlew :core:test --stacktrace

      - name: Build the APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kharcha.apk

      # A release gives a plain .apk link that is easy to open on the phone:
      # https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kharcha build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: kharcha.apk
          body: |
            Install: download kharcha.apk below on your phone and open it.
            First install only: Settings → Apps → Kharcha → ⋮ → Allow restricted settings, then allow SMS in the app.
            Built from ${{ github.sha }}.

      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
